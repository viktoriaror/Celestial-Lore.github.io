<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Легенды и мифы на небе ˗ˏˋ★ˎˊ˗</title>
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        /* Базовые стили (CSS) */
        :root {
            --bg-color: #050b18;
            --card-bg: #1b2843;
            --accent-color: #6096d4;
            --text-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, #000000, var(--bg-color));
        }

        h1 { margin: 0; font-size: 4rem; color: var(--accent-color); }
        p.subtitle { opacity: 0.8; }

        /* Фильтр */
        .filter-buttons {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
        }

        button:hover, button.active {
            background: var(--accent-color);
            color: white;
        }

        /* Сетка карточек */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 13px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .card h3 { color: var(--accent-color); margin-top: 0; }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 26px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Легенды и мифы на небе</h1>
    <p class="subtitle">Интерактивный путеводитель по созвездиям</p>
</header>

<div class="filter-buttons">
    <button onclick="filterCards('all')" class="active">Все</button>
    <button onclick="filterCards('animal')">Животные</button>
    <button onclick="filterCards('human')">Герои</button>
</div>

<div class="container" id="stars-container">
    <!-- Карточки будут добавлены через JS -->
</div>

<!-- Модальное окно -->
<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
    </div>
</div>

<script>
    /* Данные (JavaScript объект) */
    const constellations = [
        {
            name: "Большая Медведица",
            category: "animal",
            short: "Самое известное созвездие северного неба.",
            full: "В греческой мифологии это нимфа Каллисто, которую Зевс превратил в медведицу, чтобы спасти от гнева Геры. Позже он поместил её на небо."
        },
        {
            name: "Орион",
            category: "human",
            short: "Великий охотник, видимый по всему миру.",
            full: "Орион не был обычным человеком. Он был сыном Посейдона, бога морей. От отца он унаследовал невероятный рост, силу и уникальный дар — способность ходить по воде, как по суше. Он считался самым красивым мужчиной на Земле, а его охотничьи навыки не имели равных. Своей дубиной из цельной бронзы он мог победить любого зверя. Орион был настолько самоуверен, что пообещал истребить всех животных на планете. Богиня земли Гея ужаснулась такой жестокости и подослала к нему крошечного, но смертоносного Скорпиона. Герой, победивший львов и быков, пал от одного ядовитого укуса в пятку. Зевс поместил обоих на небо, но развёл их по разным углам: именно поэтому, когда Скорпион восходит на востоке, Орион в ужасе скрывается за горизонтом на западе. Они никогда не встречаются на небе одновременно."
        },
        {
            name: "Кассиопея",
            category: "human",
            short: "Созвездие в форме буквы W.",
            full: "Кассиопея была царицей Эфиопии, женщиной невероятно красивой, но очень самовлюбленной. Однажды её гордыня зашкалила, и она заявила, что она (или её дочь Андромеда) прекраснее всех морских нимф.Нимфы обиделись и пожаловались богу морей Посейдону. Тот не стал долго думать и наслал на царство Кассиопеи страшное чудовище — Кита, который начал крушить всё на своём пути. Чтобы спасти народ, царице пришлось приковать свою дочь Андромеду к скале на съедение монстру (но её вовремя спас герой Персей)."
        },
        {
            name: "Лев",
            category: "animal",
            short: "Яркое зодиакальное созвездие.",
            full: "Считается, что это тот самый Немейский лев, которого победил Геракл во время своего первого подвига."
        },
        {
            name: "Большая Медведица (Лось)",
            category: "animal",
            short: "Славянский небесный навигатор.",
            full: "Большая Медведица у славян часто называлась «Лосем» или «Повозкой» (Колесницей). Полярную звезду называли «Приколом» (колышком, к которому привязан конь), вокруг которого вращаются остальные звезды. Это показывает, что небо воспринималось как часть привычного деревенского мира. Если греки видели в небе Большую Медведицу, то наши предки-славяне видели там Великого Лося. Это был не просто зверь, а могучее небесное существо, которое несет на своих рогах свет и порядок. По преданию, каждую ночь по небесному своду убегает от преследователей огромный золотой Лось (Большая Медведица). За ним во весь опор скачут небесные охотники. Грохот их копыт — это гром, а искры, вылетающие из-под подков — это падающие звезды."
        },
        {
            name: "Шэнь (Три Звезды)",
            category: "human",
            short: "Боги Счастья, Процветания и Долголетия.",
            full: "В древнем Китае три яркие звезды в центре Ориона считались воплощением богов Счастья, Процветания и Долголетия. По легенде, эти божества спустились на небо, чтобы стать вечными стражами Небесной империи и следить за судьбами людей. Каждую зиму они светят особенно ярко, напоминая о важности семейного тепла и верности своему долгу. Китайские воины верили, что Шэнь — это великий генерал, чья звездная броня защищает мир от хаоса. Считается, что если искренне попросить эти звезды о помощи, они принесут в дом удачу, которую невозможно потерять."
        }
    ];

    const container = document.getElementById('stars-container');

    // Функция создания карточек
    function displayCards(data) {
        container.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(item);
            card.innerHTML = `
                <h3>${item.name}</h3>
                <p>${item.short}</p>
            `;
            container.appendChild(card);
        });
    }

    // Фильтрация
    function filterCards(cat) {
        // Обновляем кнопки
        document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (cat === 'all') {
            displayCards(constellations);
        } else {
            const filtered = constellations.filter(c => c.category === cat);
            displayCards(filtered);
        }
    }

    // Модальное окно
    function openModal(item) {
        document.getElementById('modal-title').innerText = item.name;
        document.getElementById('modal-text').innerText = item.full;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    // Инициализация при загрузке
    displayCards(constellations);
function createFlyingStars() {
    const starCount = 60; // Количество звезд
    
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        
        // Настраиваем стили напрямую через JS
        Object.assign(star.style, {
            position: 'fixed',
            backgroundColor: 'white',
            borderRadius: '50%',
            pointerEvents: 'none',
            zIndex: '-1', // Чтобы были за текстом
            width: Math.random() * 3 + 'px',
            height: Math.random() * 3 + 'px',
            left: Math.random() * 100 + 'vw',
            top: Math.random() * 100 + 'vh',
            opacity: Math.random(),
        });

        document.body.appendChild(star);

        // Создаем анимацию движения через JS
        let speed = Math.random() * 1 + 0.1; // Скорость полета
        let posY = parseFloat(star.style.top);

        function move() {
            posY -= speed; // Движение вверх
            if (posY < -5) { // Если улетела за экран — возвращаем вниз
                posY = 105;
                star.style.left = Math.random() * 100 + 'vw';
            }
            star.style.top = posY + 'vh';
            requestAnimationFrame(move);
        }
        move();
    }
}

// Запускаем магию
createFlyingStars();
function enlargeButtons() {
    // Находим все кнопки в блоке фильтров
    const buttons = document.querySelectorAll('.filter-buttons button');
    
    buttons.forEach(btn => {
        // Применяем увеличенные стили напрямую
        Object.assign(btn.style, {
            padding: '15px 25px',     // Делаем кнопки больше
            fontSize: '1.2rem',       // Увеличиваем шрифт
            margin: '10px',           // Добавляем отступы
            borderWidth: '2px',       // Делаем рамку толще
            fontWeight: 'bold',       // Жирный текст
            textTransform: 'uppercase', // Все буквы заглавные (по желанию)
            letterSpacing: '1px'      // Расстояние между буквами
        });
        // Поднимаем блок кнопок выше
const filterContainer = document.querySelector('.filter-buttons');
if (filterContainer) {
    filterContainer.style.marginTop = '0px'; // Убираем верхний отступ у кнопок
    filterContainer.style.marginBottom = '30px'; 
}

// Уменьшаем отступ у шапки (header), чтобы всё подтянулось вверх
const header = document.querySelector('header');
if (header) {
    header.style.paddingBottom = '10px'; // Уменьшаем нижний отступ шапки
}

// Уменьшаем отступ у подзаголовка
const subtitle = document.querySelector('.subtitle');
if (subtitle) {
    subtitle.style.marginBottom = '10px';
}

    });
}

// Запускаем увеличение
enlargeButtons();


</script>

</body>
</html>
